name = "fixmia02"
compatibility_date = "2024-12-30"
compatibility_flags = ["nodejs_compat"]
main = ".open-next/worker.js"

[assets]
directory = ".open-next/assets"
binding = "ASSETS"

# --- WhatsApp click counter (see app/wa/route.ts + app/stats/page.tsx) ---
# The buttons already work without this; KV just turns on the /stats counter.
# One-time setup:
# Namespace "CLICKS" created 2026-09-03. To read the counters from the CLI:
#   npx wrangler kv key get --binding CLICKS total --remote
# The /stats dashboard needs the STATS_TOKEN secret:
#   npx wrangler secret put STATS_TOKEN

[[kv_namespaces]]
binding = "CLICKS"
id = "be7803f8fd154bb68c58cfb77cd6ad76"
